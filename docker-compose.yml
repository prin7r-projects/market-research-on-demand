services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    image: cited-landing:latest
    container_name: cited-landing
    restart: unless-stopped
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.market-research-on-demand.rule=Host(`market-research-on-demand.prin7r.com`)"
      - "traefik.http.routers.market-research-on-demand.entrypoints=websecure"
      - "traefik.http.routers.market-research-on-demand.tls.certresolver=letsencrypt"
      - "traefik.http.services.market-research-on-demand.loadbalancer.server.port=3000"
